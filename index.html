<style id="mrq-site-visit-style">
/* Virtual Tour — floating CTA, only while the Location section is in view */
#mrq-virtual-tour{position:fixed;right:2.25rem;bottom:7.2rem;z-index:109;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(28px) scale(.86);filter:blur(5px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .85s cubic-bezier(.22,1,.36,1),filter .7s ease,visibility 0s linear .7s}
#mrq-virtual-tour.mrq-vt-visible{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0) scale(1);filter:blur(0);transition-delay:0s}
#mrq-virtual-tour button{position:relative;display:flex;align-items:center;gap:14px;padding:13px 16px 13px 18px;border:1px solid var(--m-gold);background:rgba(36,31,27,.96);color:var(--m-base);font-size:.66rem;font-weight:500;text-transform:uppercase;letter-spacing:.22em;box-shadow:0 14px 38px rgba(0,0,0,.22);cursor:pointer;border-radius:999px;overflow:hidden;transition:background .45s ease,color .45s ease,transform .45s ease,box-shadow .45s ease}
#mrq-virtual-tour button::before{content:"";position:absolute;inset:0;background:var(--m-gold);transform:translateX(-101%);transition:transform .65s cubic-bezier(.22,1,.36,1);z-index:0}
#mrq-virtual-tour button:hover::before{transform:translateX(0)}
#mrq-virtual-tour button:hover{color:var(--m-earth);transform:translateY(-3px);box-shadow:0 20px 45px rgba(0,0,0,.28)}
#mrq-virtual-tour button>*{position:relative;z-index:1}
#mrq-virtual-tour .mrq-vt-mark{width:25px;height:25px;display:inline-flex;align-items:center;justify-content:center;border:1px solid currentColor;font-size:.82rem;letter-spacing:0;transition:transform .55s cubic-bezier(.22,1,.36,1);border-radius:50%}
#mrq-virtual-tour button:hover .mrq-vt-mark{transform:rotate(45deg)}
#mrq-virtual-tour::after{content:"";position:absolute;inset:-7px;border:1px solid rgba(198,155,87,.34);opacity:0;transform:scale(.72);animation:mrq-vt-pulse 2.8s ease-out infinite;pointer-events:none}
#mrq-virtual-tour.mrq-vt-visible::after{opacity:1}
@keyframes mrq-vt-pulse{0%{transform:scale(.72);opacity:.7}75%,100%{transform:scale(1.16);opacity:0}}

/* Book a Site Visit — emerges from behind Send Enquiry */
#mrq-site-visit-wrap{position:relative;z-index:1;display:inline-flex;overflow:visible;width:auto;margin-left:-190px;opacity:0;transform:translateX(-22px) scale(.96);pointer-events:none;transition:margin-left .95s cubic-bezier(.22,1,.36,1),opacity .55s ease,transform .95s cubic-bezier(.22,1,.36,1)}
#mrq-site-visit-wrap.mrq-visible{margin-left:16px;opacity:1;transform:translateX(0) scale(1);pointer-events:auto}
#mrq-site-visit-btn{position:relative;display:flex;align-items:center;justify-content:space-between;gap:18px;white-space:nowrap;border:1px solid rgba(198,155,87,.82);background:var(--m-earth);color:var(--m-base);padding:15px 20px;font-size:.72rem;font-weight:500;text-transform:uppercase;letter-spacing:.24em;cursor:pointer;box-shadow:0 12px 35px rgba(0,0,0,.18);transition:background .5s ease,color .5s ease,transform .5s ease,box-shadow .5s ease}
#mrq-site-visit-btn::after{content:"";position:absolute;inset:4px;border:1px solid rgba(198,155,87,.22);pointer-events:none}
#mrq-site-visit-btn:hover{background:var(--m-gold);color:var(--m-earth);transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.24)}
#mrq-site-visit-btn .mrq-sv-arrow{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border:1px solid currentColor;font-size:.9rem;letter-spacing:0;transition:transform .5s cubic-bezier(.22,1,.36,1)}
#mrq-site-visit-btn:hover .mrq-sv-arrow{transform:translateX(4px) rotate(-4deg)}
#mrq-site-visit-modal{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(18,15,12,.68);backdrop-filter:blur(10px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s ease,visibility .45s ease}
#mrq-site-visit-modal.mrq-open{opacity:1;visibility:visible;pointer-events:auto}
.mrq-sv-panel{position:relative;width:min(620px,100%);max-height:min(88vh,760px);overflow:auto;background:var(--m-earth);color:var(--m-base);border:1px solid rgba(198,155,87,.48);padding:34px;box-shadow:0 30px 90px rgba(0,0,0,.42);transform:translateY(26px) scale(.97);transition:transform .6s cubic-bezier(.22,1,.36,1)}
#mrq-site-visit-modal.mrq-open .mrq-sv-panel{transform:translateY(0) scale(1)}
.mrq-sv-close{position:absolute;right:18px;top:16px;width:34px;height:34px;border:1px solid rgba(254,254,254,.25);background:transparent;color:var(--m-base);cursor:pointer;font-size:20px;line-height:1;transition:background .3s ease,color .3s ease}
.mrq-sv-close:hover{background:var(--m-gold);color:var(--m-earth)}
.mrq-sv-kicker{font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--m-gold-lift);margin-bottom:12px}
.mrq-sv-title{font-family:inherit;font-size:clamp(2rem,5vw,3.1rem);line-height:1.02;margin:0 45px 10px 0}
.mrq-sv-copy{font-size:.88rem;line-height:1.65;color:rgba(254,254,254,.7);margin:0 0 26px}
.mrq-sv-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.mrq-sv-field{display:block}.mrq-sv-field.full{grid-column:1/-1}
.mrq-sv-label{display:block;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(254,254,254,.62);margin-bottom:7px}
.mrq-sv-input{width:100%;border:0;border-bottom:1px solid rgba(254,254,254,.24);background:transparent;color:var(--m-base);padding:10px 0;outline:none;font:inherit;font-size:.9rem}.mrq-sv-input:focus{border-bottom-color:var(--m-gold)}.mrq-sv-input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7}
.mrq-sv-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mrq-sv-slot{border:1px solid rgba(254,254,254,.2);background:transparent;color:rgba(254,254,254,.82);padding:11px 7px;font-size:.68rem;letter-spacing:.08em;cursor:pointer;transition:all .3s ease}.mrq-sv-slot:hover,.mrq-sv-slot.selected{border-color:var(--m-gold);background:rgba(198,155,87,.14);color:var(--m-gold-lift)}
.mrq-sv-submit{margin-top:28px;width:100%;display:flex;align-items:center;justify-content:center;gap:14px;border:1px solid var(--m-gold);background:var(--m-gold);color:var(--m-earth);padding:15px 20px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.24em;cursor:pointer;transition:all .4s ease}.mrq-sv-submit:hover{background:transparent;color:var(--m-base)}
.mrq-sv-success{display:none;text-align:center;padding:34px 10px 12px}.mrq-sv-success.show{display:block}.mrq-sv-form.hidden{display:none}
@media(max-width:640px){#mrq-virtual-tour{right:1rem;bottom:5.6rem}#mrq-virtual-tour button{font-size:.56rem;padding:11px 12px 11px 14px;letter-spacing:.16em}.mrq-sv-panel{padding:26px 22px}.mrq-sv-grid{grid-template-columns:1fr}.mrq-sv-field.full{grid-column:auto}.mrq-sv-slots{grid-template-columns:repeat(2,1fr)}#mrq-site-visit-wrap{margin-left:-160px}#mrq-site-visit-wrap.mrq-visible{margin-left:12px}}
/* Match both enquiry actions and keep wrapped buttons on the same left edge. */
.mrq-enquiry-actions{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}
.mrq-enquiry-actions #mrq-site-visit-wrap{width:100%;min-width:0;margin-left:0}
#enquire .mrq-enquiry-actions>button,#mrq-site-visit-btn{box-sizing:border-box;width:100%;min-height:56px;justify-content:space-between;gap:12px;padding:14px 18px;font-size:.7rem;line-height:1.2;letter-spacing:.18em;white-space:nowrap}
#enquire .mrq-enquiry-actions>button{position:relative;z-index:2}
#enquire .mrq-enquiry-actions>button>span{width:24px;flex-shrink:0}
#mrq-site-visit-btn .mrq-sv-arrow{width:24px;height:24px;flex-shrink:0}
@media(max-width:640px){.mrq-enquiry-actions{grid-template-columns:minmax(0,1fr)}}
</style>
<script>
(function(){
  const init=()=>{
    if(document.getElementById('mrq-site-visit-wrap')) return true;
    const buttons=[...document.querySelectorAll('button')];
    const send=buttons.find(b=>b.textContent.trim().toLowerCase()==='send enquiry');
    const footer=document.getElementById('enquire');
    const location=document.getElementById('location');
    if(!send||!footer||!location) return false;

    /* --- Floating Explore Virtual Tour --- */
    const vt=document.createElement('div'); vt.id='mrq-virtual-tour';
    vt.innerHTML='<button type="button" aria-label="Explore Virtual Tour"><span>Explore Virtual Tour</span><span class="mrq-vt-mark">↗</span></button>';
    document.body.appendChild(vt);
    vt.querySelector('button').addEventListener('click',()=>window.open('https://nsventures.in/Meraqui-Gillco-VR/','_blank','noopener,noreferrer'));

    /* --- Site visit button alongside Send Enquiry --- */
    const wrap=document.createElement('div'); wrap.id='mrq-site-visit-wrap';
    wrap.innerHTML='<button id="mrq-site-visit-btn" type="button" aria-label="Book a site visit"><span>Book a site visit</span><span class="mrq-sv-arrow">↗</span></button>';
    send.parentElement.appendChild(wrap);
    send.parentElement.classList.add('mrq-enquiry-actions');

    const modal=document.createElement('div'); modal.id='mrq-site-visit-modal'; modal.setAttribute('aria-hidden','true');
    const today=new Date().toISOString().split('T')[0];
    modal.innerHTML=`<div class="mrq-sv-panel" role="dialog" aria-modal="true" aria-labelledby="mrq-sv-title">
      <button class="mrq-sv-close" type="button" aria-label="Close">×</button>
      <div class="mrq-sv-form"><div class="mrq-sv-kicker">Private appointment</div><h3 class="mrq-sv-title" id="mrq-sv-title">Book a site visit</h3><p class="mrq-sv-copy">Choose a convenient date and time. The Meraqui Experience Centre will confirm your appointment.</p>
      <form id="mrq-sv-form"><div class="mrq-sv-grid">
      <label class="mrq-sv-field"><span class="mrq-sv-label">Name</span><input class="mrq-sv-input" name="name" required minlength="2" placeholder="Your name"></label>
      <label class="mrq-sv-field"><span class="mrq-sv-label">Phone number</span><input class="mrq-sv-input" name="phone" type="tel" required pattern="(?:\+91[ -]?)?[6-9][0-9]{9}" placeholder="+91 98765 43210"></label>
      <label class="mrq-sv-field"><span class="mrq-sv-label">Preferred date</span><input class="mrq-sv-input" name="date" type="date" min="${today}" required></label>
      <div class="mrq-sv-field"><span class="mrq-sv-label">Preferred time</span><div class="mrq-sv-slots">${['10:00 AM','11:30 AM','01:00 PM','03:00 PM','04:30 PM','06:00 PM'].map(x=>`<button type="button" class="mrq-sv-slot" data-time="${x}">${x}</button>`).join('')}</div><input type="hidden" name="time" required></div>
      </div><button class="mrq-sv-submit" type="submit">Request site visit <span>↗</span></button></form></div>
      <div class="mrq-sv-success"><div class="mrq-sv-kicker">Appointment request received</div><h3 class="mrq-sv-title">Thank you.</h3><p class="mrq-sv-copy">We have your preferred date and time. The Meraqui Experience Centre will contact you to confirm the visit.</p><button type="button" class="mrq-sv-submit mrq-sv-again">Book another site visit <span>↗</span></button></div>
    </div>`;
    document.body.appendChild(modal);
    const resetSiteVisitForm=()=>{
      const f=modal.querySelector('#mrq-sv-form');
      const success=modal.querySelector('.mrq-sv-success');
      if(f){
        f.reset();
        f.classList.remove('hidden');
        const time=f.querySelector('[name="time"]');
        if(time) time.value='';
        f.querySelectorAll('.mrq-sv-slot').forEach(b=>b.classList.remove('selected'));
        const submit=f.querySelector('.mrq-sv-submit');
        if(submit){submit.disabled=false;submit.innerHTML='Request site visit <span>↗</span>';}
      }
      if(success) success.classList.remove('show');
    };
    const close=()=>{modal.classList.remove('mrq-open');modal.setAttribute('aria-hidden','true');document.body.style.overflow='';resetSiteVisitForm()};
    const open=()=>{resetSiteVisitForm();modal.classList.add('mrq-open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'};
    document.getElementById('mrq-site-visit-btn').addEventListener('click',open); modal.querySelector('.mrq-sv-close').addEventListener('click',close); modal.addEventListener('click',e=>{if(e.target===modal)close()}); document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
    modal.querySelectorAll('.mrq-sv-slot').forEach(btn=>btn.addEventListener('click',()=>{modal.querySelectorAll('.mrq-sv-slot').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');modal.querySelector('[name="time"]').value=btn.dataset.time}));
    modal.querySelector('.mrq-sv-again').addEventListener('click',resetSiteVisitForm);
    const MRQ_SITE_VISIT_SCRIPT_URL='https://script.google.com/macros/s/AKfycbwe1sV2oR9iL5E0XAcO1Dsdkz_CBD7ss9mLDzjkUSTngQZiTda9RDy762W8JpUnNzaKmA/exec';
    modal.querySelector('#mrq-sv-form').addEventListener('submit',async e=>{
      e.preventDefault();
      const f=e.currentTarget,time=f.querySelector('[name="time"]').value;
      if(!time){f.querySelector('[name="time"]').setCustomValidity('Please select a time slot.');f.reportValidity();f.querySelector('[name="time"]').setCustomValidity('');return}
      const formData=new FormData(f);
      const data={type:'siteVisit',name:formData.get('name')||'',phone:formData.get('phone')||'',date:formData.get('date')||'',time:formData.get('time')||''};
      const submit=f.querySelector('.mrq-sv-submit');
      submit.disabled=true;
      submit.innerHTML='Sending <span>↗</span>';
      try{
        await fetch(MRQ_SITE_VISIT_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});
        f.classList.add('hidden');
        modal.querySelector('.mrq-sv-success').classList.add('show');
      }catch(error){
        console.error('Site visit booking error:',error);
        submit.disabled=false;
        submit.innerHTML='Request site visit <span>↗</span>';
        alert('We could not submit your site visit request. Please try again.');
      }
    });

    /* Location CTA: reveal while Location is visible, and hide immediately when ANY next section enters. */
    const reveal=()=>{
      const lr=location.getBoundingClientRect(), fr=footer.getBoundingClientRect(), vh=window.innerHeight;
      const next=location.nextElementSibling;
      const nr=next?next.getBoundingClientRect():null;
      const nextHasEntered=!!nr && nr.top < vh;
      const locationActive=lr.top < vh && lr.bottom > 0 && !nextHasEntered;
      vt.classList.toggle('mrq-vt-visible',locationActive);
      /* Site visit begins only when the footer is substantially on screen. */
      const footerFullPreview=fr.top <= vh*0.72 && fr.bottom > vh*0.18;
      wrap.classList.toggle('mrq-visible',footerFullPreview);
    };
    let ticking=false; const onScroll=()=>{if(!ticking){requestAnimationFrame(()=>{reveal();ticking=false});ticking=true}};
    window.addEventListener('scroll',onScroll,{passive:true}); window.addEventListener('resize',reveal); reveal();
    return true;
  };
  if(!init()){const mo=new MutationObserver(()=>{if(init())mo.disconnect()});mo.observe(document.documentElement,{childList:true,subtree:true});setTimeout(()=>mo.disconnect(),15000)}
})();
</script>
<style id="mrq-ethos-reveal-style">
/* Ethos blueprint image — starts invisible, fades in once the section is reached */
#ethos .et-draw{opacity:0 !important;transition:opacity 1.4s cubic-bezier(.22,1,.36,1)}
#ethos .et-draw.mrq-et-visible{opacity:.94 !important}
@media(max-width:1024px){
  #ethos .et-draw.mrq-et-visible{opacity:.22 !important}
}
</style>
<script>
(function(){
  const init=()=>{
    const section=document.getElementById('ethos');
    const draw=section&&section.querySelector('.et-draw');
    if(!draw) return false;

    const observer=new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          draw.classList.add('mrq-et-visible');
          observer.unobserve(entry.target); // fades in once, stays visible
        }
      });
    },{threshold:0.7});
    observer.observe(section);
    return true;
  };
  if(!init()){
    const mo=new MutationObserver(()=>{if(init())mo.disconnect()});
    mo.observe(document.documentElement,{childList:true,subtree:true});
    setTimeout(()=>mo.disconnect(),15000);
  }
})();
</script>
<script>
(function(){
  if (window.__mrqVHLock) return;
  var desc = Object.getOwnPropertyDescriptor(window, 'innerHeight');
  if (!desc || !desc.configurable) return;
  window.__mrqVHLock = true;

  var vw = window.visualViewport ? window.visualViewport.width  : document.documentElement.clientWidth;
  var vh = window.visualViewport ? window.visualViewport.height : document.documentElement.clientHeight;

  try {
    Object.defineProperty(window, 'innerHeight', { configurable: true, get: function(){ return vh; } });
  } catch(e){ return; }

  function sync(){
    var nw = window.visualViewport ? window.visualViewport.width  : document.documentElement.clientWidth;
    var nh = window.visualViewport ? window.visualViewport.height : document.documentElement.clientHeight;
    if (nw !== vw) {
      vw = nw; vh = nh;
      window.dispatchEvent(new Event('resize'));
    }
  }

  if (window.visualViewport) window.visualViewport.addEventListener('resize', sync);
  window.addEventListener('orientationchange', function(){ setTimeout(sync, 300); });
})();
</script>
